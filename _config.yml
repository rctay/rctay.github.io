title: Ray
subtitle: do { code; learn; sleep; } repeat;
description: >-
  sapere: (noun) knowledge, learning.
url: "https://raythelean.dev"
baseurl: ""
repository: rctay/rctay.github.io
locale: en-US
minimal_mistakes_skin: default
after_footer_scripts:
  - /assets/js/tagline.js
date_format: "%d %b %Y"

theme: minimal-mistakes-jekyll
permalink: /:categories/:title
markdown: kramdown

plugins:
  - jekyll-feed
  - jekyll-include-cache

tag_archive:
  type: liquid
  path: /tags.html

analytics:
  provider: google-gtag
  google:
    tracking_id: UA-16555949-2

footer:
  links:
    - label: GitHub
      icon: fab fa-fw fa-github
      url: https://github.com/rctay/rctay.github.io

kramdown:
  header_offset: 1

collections:
  drafts:
    output: true

exclude:
  - public/revealjs/css/theme/README.md
  - public/revealjs/plugin/markdown/example.md
  - docs/superpowers/
  - vendor/
  - .bundle/
  - Gemfile
  - Gemfile.lock
  - script/

version: 1.0.0

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      show_date: true
  - scope:
      path: "_drafts"
    values:
      layout: post
      meta_robots: noindex
